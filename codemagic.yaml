# Compilation iPhone dans le cloud avec Codemagic (https://codemagic.io)
# Le projet de l'appli est dans le dossier "app".
# Prérequis dans Codemagic : Team settings > Integrations > Developer Portal,
# ajoutez votre clé API App Store Connect sous le nom "app_store_connect".
workflows:
  ios-release:
    name: Blocaille iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blocaille.jeu
    scripts:
      - name: Installer les dépendances
        script: |
          cd app
          npm install
      - name: Créer le projet iOS
        script: |
          cd app
          [ -d ios ] || npx cap add ios
          node scripts/configure-native.mjs
          npx capacitor-assets generate --ios --iconBackgroundColor '#a43dff' --splashBackgroundColor '#a43dff'
          npx cap sync ios
      - name: Signature
        script: xcode-project use-profiles
      - name: Numéro de build
        script: |
          cd app/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Compiler l'IPA
        script: |
          cd app
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Blocaille Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      groups:
        - android_signing # CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
    scripts:
      - name: Installer les dépendances
        script: |
          cd app
          npm install
      - name: Créer le projet Android
        script: |
          cd app
          [ -d android ] || npx cap add android
          node scripts/configure-native.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#a43dff' --splashBackgroundColor '#a43dff'
          npx cap sync android
      - name: Numéro de version
        script: |
          cd app/android/app
          perl -pi -e "s/versionCode \\d+/versionCode $(($BUILD_NUMBER + 1))/" build.gradle
      - name: Compiler l'AAB signé
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/blocaille-upload.jks
          cd app/android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/blocaille-upload.jks \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - app/android/app/build/outputs/bundle/release/*.aab
